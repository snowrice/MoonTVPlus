name: Sync Fork

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with upstream
        run: gh repo sync ${{ github.repository }} -b main --source mtvpls/MoonTVPlus --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
